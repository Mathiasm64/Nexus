<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lager Übersicht</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .nav-tabs-custom {
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 30px;
        }

        .nav-tabs-custom .nav-link {
            color: #333;
            background-color: #f0f0f0;
            border: none;
            border-radius: 8px 8px 0 0;
            margin-right: 8px;
            padding: 10px 20px;
            font-weight: 500;
        }

        .nav-tabs-custom .nav-link.active {
            background-color: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom: 1px solid white;
        }

        .search-bar {
            background-color: #f0f0f0;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            color: #666;
        }

        .filter-dropdown {
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 16px;
            color: #333;
        }

        .badge-raw-materials {
            background-color: #e3f2fd;
            color: #1976d2;
        }

        .badge-components {
            background-color: #e8f5e9;
            color: #388e3c;
        }

        .badge-consumables {
            background-color: #fffde7;
            color: #f57f17;
        }

        .barcode {
            color: #999;
            font-size: 14px;
        }

        .action-icons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .action-icons a {
            color: #666;
            cursor: pointer;
            font-size: 18px;
            text-decoration: none;
        }

        .action-icons a:hover {
            color: #333;
        }

        .action-icons .delete {
            color: #d32f2f;
        }

        .action-icons .delete:hover {
            color: #c62828;
        }

        .navbar-brand {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="http://127.0.0.1:5500/Frontend/home.html">
                <i class="bi bi-box-seam me-2"></i>WarehouseHub
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-3 me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="http://127.0.0.1:5500/Frontend/lager_uebersicht.html">
                            Warehouses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="http://127.0.0.1:5500/Frontend/Scanner.html">Scanner</a>
                    </li>
                    <li class="nav-item" id="adminNavItem" style="display: none;">
                        <a class="nav-link" href="http://127.0.0.1:5500/Frontend/Admin.html">Admin</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small">angemeldet als: <span id="userName">loading...</span></span>
                    <button class="btn btn-outline-secondary btn-sm" id="logoutBtn">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div style="height:70px"></div>
    <div class="container-fluid p-4">
     
        <!-- Search and Filter Bar -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text search-bar" style="border: none; background-color: #f0f0f0;">
                        <i class="fas fa-search" style="color: #999;"></i>
                    </span>
                    <input id="searchInput" type="text" class="form-control search-bar" placeholder="Search by name or barcode..." style="border: none;">
                </div>
            </div>
            <div class="col-md-6 text-end">
                <select id="warehouseFilter" class="filter-dropdown me-3">
                    <option>All Warehouses</option>
                    <option>Main Manufacturing Warehouse</option>
                    <option>Distribution Center North</option>
                    <option>Assembly Warehouse</option>
                </select>
                <select id="categoryFilter" class="filter-dropdown me-3">
                    <option>All Categories</option>
                    <option>Raw Materials</option>
                    <option>Components</option>
                    <option>Consumables</option>
                </select>
                <button id="addItemBtn" class="btn btn-add-item">
                    <i class="fas fa-plus me-2"></i> Add Item
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Barcode</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Warehouse</th>
                        <th>Location</th>
                        <th>Last Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody">
                    
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemModalTitle">Artikel hinzufügen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <form id="itemForm">
                    <div class="modal-body">
                        <input type="hidden" id="formPlId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="formProduktName" class="form-label">Produktname</label>
                                <input type="text" class="form-control" id="formProduktName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="formBarcode" class="form-label">Barcode</label>
                                <input type="text" class="form-control" id="formBarcode" required>
                            </div>
                            <div class="col-md-4">
                                <label for="formMenge" class="form-label">Menge</label>
                                <input type="number" min="0" class="form-control" id="formMenge" required>
                            </div>
                            <div class="col-md-8">
                                <label for="formKategorie" class="form-label">Kategorie</label>
                                <select class="form-select" id="formKategorie">
                                    <option value="">-- keine --</option>
                                    <option value="Raw Materials">Raw Materials</option>
                                    <option value="Components">Components</option>
                                    <option value="Consumables">Consumables</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="formLager" class="form-label">Lager</label>
                                <select class="form-select" id="formLager" required></select>
                            </div>
                            <div class="col-md-6">
                                <label for="formLocation" class="form-label">Lagerplatz (z. B. A-12-03)</label>
                                <input type="text" class="form-control" id="formLocation" placeholder="A-01-01" required>
                            </div>
                        </div>
                        <div id="formError" class="text-danger mt-3 d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                        <button type="submit" class="btn btn-dark" id="saveItemBtn">Speichern</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_BASE_URL = 'http://127.0.0.1:5500';

        const urlParams = new URLSearchParams(window.location.search);
        const urlLagerId = urlParams.get('lagerId');
        const tbody = document.querySelector('#inventoryBody');
        const addItemBtn = document.getElementById('addItemBtn');
        const itemForm = document.getElementById('itemForm');
        const itemModalElement = document.getElementById('itemModal');
        const itemModal = new bootstrap.Modal(itemModalElement);
        const modalTitle = document.getElementById('itemModalTitle');
        const formError = document.getElementById('formError');
        const searchInput = document.getElementById('searchInput');
        const warehouseFilter = document.getElementById('warehouseFilter');
        const categoryFilter = document.getElementById('categoryFilter');

        // Auth display: show logged-in user and admin link
        function updateAuthDisplay() {
            const userJson = localStorage.getItem('user');
            const userNameEl = document.getElementById('userName');
            const adminNavItem = document.getElementById('adminNavItem');
            if (userJson) {
                try {
                    const u = JSON.parse(userJson);
                    if (userNameEl) userNameEl.textContent = u.name || u.username || u.email || 'angemeldet';
                    if (adminNavItem) adminNavItem.style.display = (u.email === 'admin@example.com') ? 'block' : 'none';
                } catch (_) {
                    if (userNameEl) userNameEl.textContent = 'angemeldet';
                }
            } else {
                if (userNameEl) userNameEl.textContent = 'Nicht angemeldet';
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'http://127.0.0.1:5500/Frontend/login.html';
                });
            }
        }

        let produkteState = [];
        let lagerState = [];
        let initialLoadDone = false;

        function showError(message) {
            formError.textContent = message;
            formError.classList.remove('d-none');
        }

        function clearError() {
            formError.textContent = '';
            formError.classList.add('d-none');
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function toLocation(product) {
            if (!product.regalNR || !product.regalSection || !product.regalShelf) {
                return 'A-01-01';
            }
            return `${product.regalNR}-${product.regalSection}-${product.regalShelf}`;
        }

        function resetForm() {
            const plField = document.getElementById('formPlId');
            plField.value = '';
            plField.dataset.lagerId = '';
            document.getElementById('formProduktName').value = '';
            document.getElementById('formBarcode').value = '';
            document.getElementById('formMenge').value = '0';
            document.getElementById('formKategorie').value = '';
            document.getElementById('formLocation').value = 'A-01-01';
            const preselect = urlLagerId || (warehouseFilter.value !== 'all' ? warehouseFilter.value : (lagerState[0]?.lagerId ?? ''));
            populateLagerSelect(preselect);
            clearError();
        }

        function formatDate(value) {
            if (!value) return '-';
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return '-';
            return parsed.toISOString().slice(0, 10);
        }

        function getLagerIdForCreate() {
            return document.getElementById('formLager').value || null;
        }

        function populateLagerSelect(selectedId) {
            const sel = document.getElementById('formLager');
            sel.innerHTML = lagerState.map((lager) =>
                `<option value="${escapeHtml(lager.lagerId)}"${String(lager.lagerId) === String(selectedId) ? ' selected' : ''}>${escapeHtml(lager.lagerName)}</option>`
            ).join('');
        }

        function getDisplayLagerName(lagerId) {
            const found = lagerState.find((lager) => String(lager.lagerId) === String(lagerId));
            return found?.lagerName || `Lager #${lagerId}`;
        }

        function getBadgeClass(kategorie) {
            if (!kategorie) return 'badge-components';
            const k = kategorie.toLowerCase();
            if (k.includes('raw')) return 'badge-raw-materials';
            if (k.includes('consum')) return 'badge-consumables';
            return 'badge-components';
        }

        function renderProducts() {
            const query = (searchInput.value || '').trim().toLowerCase();
            const selectedCategory = (categoryFilter.value || '').trim().toLowerCase();
            const filtered = produkteState.filter((product) => {
                const matchesQuery = !query || (
                    (product.produktName || '').toLowerCase().includes(query) ||
                    String(product.barcode || '').toLowerCase().includes(query)
                );

                const matchesCategory = !selectedCategory || selectedCategory === 'all categories' ||
                    (product.kategorie || '').toLowerCase() === selectedCategory;

                return matchesQuery && matchesCategory;
            });

            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-muted">Keine Produkte gefunden</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map((product) => {
                const location = toLocation(product);
                return `
                    <tr>
                        <td>${escapeHtml(product.produktName || '-')}</td>
                        <td><span class="barcode">|||| ${escapeHtml(product.barcode || '-')}</span></td>
                        <td><span class="badge ${getBadgeClass(product.kategorie)}">${escapeHtml(product.kategorie || '-')}</span></td>
                        <td>${escapeHtml(product.menge ?? 0)}</td>
                        <td>${escapeHtml(product.lagerName || `Lager #${product.lagerId || '-'}`)}</td>
                        <td>${escapeHtml(location)}</td>
                        <td>${escapeHtml(formatDate(product.lastChange))}</td>
                        <td>
                            <div class="action-icons">
                                <a href="#" class="edit-item" data-plid="${escapeHtml(product.plId)}"><i class="fas fa-edit"></i></a>
                                <a href="#" class="delete delete-item" data-plid="${escapeHtml(product.plId)}"><i class="fas fa-trash"></i></a>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function fetchProductsByLager(lagerId) {
            const response = await fetch(`${API_BASE_URL}/lager/${lagerId}/produkte`);
            if (!response.ok) {
                throw new Error(`Fehler beim Abrufen der Produkte für Lager ${lagerId}`);
            }

            const rows = await response.json();
            return rows.map((row) => ({
                ...row,
                lagerId,
                lagerName: getDisplayLagerName(lagerId),
            }));
        }

        async function loadWarehouses() {
            const response = await fetch(`${API_BASE_URL}/lager`);
            if (!response.ok) {
                throw new Error('Fehler beim Abrufen der Lager');
            }

            lagerState = await response.json();

            const options = ['<option value="all">All Warehouses</option>'];
            lagerState.forEach((lager) => {
                options.push(`<option value="${escapeHtml(lager.lagerId)}">${escapeHtml(lager.lagerName)}</option>`);
            });

            warehouseFilter.innerHTML = options.join('');

            if (urlLagerId && !initialLoadDone) {
                warehouseFilter.value = urlLagerId;
            }
        }

        async function loadProducts() {
            try {
                // Auf initialem Load: verwende urlLagerId, sonst warehouseFilter.value
                let selectedWarehouseId = (!initialLoadDone && urlLagerId) ? urlLagerId : warehouseFilter.value;

                if (!selectedWarehouseId || selectedWarehouseId === 'all') {
                    if (lagerState.length === 0) {
                        produkteState = [];
                        renderProducts();
                        return;
                    }

                    const allResponses = await Promise.all(
                        lagerState.map((lager) => fetchProductsByLager(lager.lagerId))
                    );
                    produkteState = allResponses.flat();
                } else {
                    produkteState = await fetchProductsByLager(selectedWarehouseId);
                }

                renderProducts();
            } catch (error) {
                console.error('Fehler beim Laden der Produkte:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="text-danger">Fehler beim Laden der Produkte</td></tr>';
            }
        }

        function openAddModal() {
            resetForm();
            document.getElementById('formLager').disabled = false;
            modalTitle.textContent = 'Artikel hinzufügen';
            itemModal.show();
        }

        function openEditModal(product) {
            clearError();
            populateLagerSelect(product.lagerId);
            document.getElementById('formLager').disabled = true;
            const plField = document.getElementById('formPlId');
            plField.value = String(product.plId);
            plField.dataset.lagerId = String(product.lagerId || '');
            document.getElementById('formProduktName').value = product.produktName || '';
            document.getElementById('formBarcode').value = product.barcode || '';
            document.getElementById('formMenge').value = String(product.menge ?? 0);
            document.getElementById('formKategorie').value = product.kategorie || '';
            document.getElementById('formLocation').value = toLocation(product);
            modalTitle.textContent = 'Artikel bearbeiten';
            itemModal.show();
        }

        async function saveProduct(event) {
            event.preventDefault();
            clearError();

            const plField = document.getElementById('formPlId');
            const plId = plField.value;
            const editLagerId = plField.dataset.lagerId;

            const payload = {
                produktName: document.getElementById('formProduktName').value.trim(),
                barcode: document.getElementById('formBarcode').value.trim(),
                menge: Number.parseInt(document.getElementById('formMenge').value, 10),
                kategorie: document.getElementById('formKategorie').value || null,
                location: document.getElementById('formLocation').value.trim(),
            };

            if (!payload.produktName || !payload.barcode || Number.isNaN(payload.menge)) {
                showError('Bitte Pflichtfelder korrekt ausfüllen.');
                return;
            }

            const isEdit = Boolean(plId);
            const targetLagerId = isEdit ? editLagerId : getLagerIdForCreate();

            if (!targetLagerId) {
                showError('Bitte ein Lager im Dropdown auswählen.');
                return;
            }

            const url = isEdit
                ? `${API_BASE_URL}/lager/${targetLagerId}/produkte/${plId}`
                : `${API_BASE_URL}/lager/${targetLagerId}/produkte`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || 'Speichern fehlgeschlagen');
                }

                itemModal.hide();
                await loadProducts();
            } catch (error) {
                showError(error.message || 'Fehler beim Speichern');
            }
        }

        async function deleteProduct(plId) {
            if (!confirm('Artikel wirklich löschen?')) {
                return;
            }

            const product = produkteState.find((item) => item.plId === plId);
            if (!product?.lagerId) {
                alert('Lagerzuordnung für diesen Artikel fehlt.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/lager/${product.lagerId}/produkte/${plId}`, {
                    method: 'DELETE',
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || 'Löschen fehlgeschlagen');
                }

                await loadProducts();
            } catch (error) {
                alert(error.message || 'Fehler beim Löschen');
            }
        }

        addItemBtn.addEventListener('click', openAddModal);
        itemForm.addEventListener('submit', saveProduct);
        searchInput.addEventListener('input', renderProducts);
        warehouseFilter.addEventListener('change', loadProducts);
        categoryFilter.addEventListener('change', renderProducts);

        tbody.addEventListener('click', (event) => {
            const target = event.target.closest('a');
            if (!target) {
                return;
            }

            event.preventDefault();
            const plId = Number.parseInt(target.dataset.plid, 10);
            if (Number.isNaN(plId)) {
                return;
            }

            if (target.classList.contains('edit-item')) {
                const product = produkteState.find((item) => item.plId === plId);
                if (product) {
                    openEditModal(product);
                }
            }

            if (target.classList.contains('delete-item')) {
                deleteProduct(plId);
            }
        });

        async function initPage() {
            try {
                await loadWarehouses();
                await loadProducts();
                initialLoadDone = true;
                updateAuthDisplay();
            } catch (error) {
                console.error('Initialisierung fehlgeschlagen:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="text-danger">Fehler bei der Initialisierung</td></tr>';
            }
        }

        initPage();
    </script>
</body>
</html>
