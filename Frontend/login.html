<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* ============================================
           GLOBALE STILE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Haupt-Body mit Gradient-Hintergrund */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1073ad 0%, #668698);
            background-size: cover;
            min-height: 100vh;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 32px 0 48px;
        }

        /* Container für gesamte Seite */
        .page {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Logo-Bereich */
        .logo-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 10px 16px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            min-height: 56px;
            min-width: 180px;
        }

        .logo-card img {
            max-height: 70px;
            width: auto;
            display: block;
        }

        /* ============================================
           LOGIN-FORMULAR
           ============================================ */
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Input-Gruppen (Email, Password) */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        /* Focus-Effekt für Eingabefelder */
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Login-Button */
        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1073ad 0%, #668698 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Signup-Link (momentan deaktiviert) */
        .signup-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .signup-link a {
            padding: 10px 15px;
            background: white;
            color: #1073ad;
            border: 2px solid #1073ad;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: all 0.2s;
        }

        .signup-link a:hover {
            background: #1073ad;
            color: white;
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Logo/Header der Anwendung -->
        <div class="logo-card">
            <img src="./noBgColor.png" alt="Nexus Logo">
        </div>

        <!-- Login-Formular -->
        <div class="login-container">
            <h1>Login</h1>
            
            <form>
                <!-- Email-Eingabefeld -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Passwort-Eingabefeld -->
                <div class="input-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <!-- Login-Button -->
                <button type="submit" class="login-button">Einloggen</button>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // LOGIN-VERARBEITUNG
        // ============================================
        
        // Event-Listener für Form-Submission
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Abrufen der eingegebenen Anmeldedaten
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // POST-Request an Login-Endpoint
                const response = await fetch('http://127.0.0.1:5500/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await response.json();
                
                // Wenn Login erfolgreich
                if (response.ok) {
                    // Speichere Token und Benutzerinfo im lokalen Storage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // Weiterleitung zur Home-Seite
                    window.location.href = './home.html';
                } else {
                    // Fehlermeldung anzeigen
                    alert(data.error || 'Login fehlgeschlagen');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Verbindungsfehler zum Server');
            }
        });

        // Test-Anmeldedaten (für Entwicklung):
        // Admin: admin@example.com / admin123
        // User: scanner@example.com / scanner123
    </script>
</body>
</html>
