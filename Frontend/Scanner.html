  <!DOCTYPE html>
  <html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WarehouseHub Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      :root {
      --brand-blue: #2563eb;
      --brand-blue-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warn: #d97706;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --border: rgba(148, 163, 184, 0.25);
      --text-muted: #64748b;
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    /* ── Navbar ── */
    .navbar { border-bottom: 1px solid var(--border); }

    /* ── Layout ── */
    main { padding-top: 72px; }

    .scanner-row {
      height: calc(100vh - 72px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem 1rem;
      overflow-y: auto;
    }

    .scanner-col { max-width: 500px; width: 100%; }

    /* ── Cards ── */
    .card-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 24px rgba(15,23,42,0.07);
      border: 1px solid var(--border);
    }

    .card-panel h4 {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #0f172a;
    }

    .card-panel > p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 16px;
    }

    /* ── Camera area ── */
    .camera-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      background: #0f172a;
      min-height: 200px;
    }

    /* Inactive state */
    .camera-inactive {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #e2e8f0, #f1f5f9);
      border-radius: 10px;
      color: var(--text-muted);
    }

    .camera-inactive i { font-size: 38px; color: #94a3b8; }
    .camera-inactive span { font-size: 0.85rem; }

    /* html5-qrcode container */
    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
    }

    /* ── Scan overlay (laser) ── */
    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Corner brackets */
    .scan-overlay::before,
    .scan-overlay::after {
      content: '';
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: #3b82f6;
      border-style: solid;
    }

    .scan-overlay::before {
      top: 18px;
      left: 18px;
      border-width: 3px 0 0 3px;
      border-radius: 4px 0 0 0;
    }

    .scan-overlay::after {
      bottom: 18px;
      right: 18px;
      border-width: 0 3px 3px 0;
      border-radius: 0 0 4px 0;
    }

    .corner-tr, .corner-bl {
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: #3b82f6;
      border-style: solid;
    }

    .corner-tr {
      top: 18px;
      right: 18px;
      border-width: 3px 3px 0 0;
      border-radius: 0 4px 0 0;
    }

    .corner-bl {
      bottom: 18px;
      left: 18px;
      border-width: 0 0 3px 3px;
      border-radius: 0 0 0 4px;
    }

    /* Laser line */
    .laser {
      position: absolute;
      left: 14%;
      right: 14%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, #f97316, #ef4444, transparent);
      border-radius: 1px;
      box-shadow: 0 0 8px rgba(239,68,68,0.8);
      animation: laser-scan 2s ease-in-out infinite;
      top: 25%;
    }

    @keyframes laser-scan {
      0%, 100% { top: 22%; opacity: 1; }
      50%       { top: 72%; opacity: 0.85; }
    }

    /* ── Scan success flash ── */
    .scan-flash {
      position: absolute;
      inset: 0;
      background: rgba(34, 197, 94, 0.25);
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.05s;
    }

    .scan-flash.active { opacity: 1; animation: flash-out 0.5s ease forwards; }

    @keyframes flash-out {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── Buttons ── */
    .btn-scan {
      background: var(--brand-blue);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 16px;
      width: 100%;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 12px;
    }

    .btn-scan:hover  { background: var(--brand-blue-dark); }
    .btn-scan:active { transform: scale(0.98); }

    .btn-scan.active-cam {
      background: #475569;
    }

    .btn-scan.active-cam:hover { background: #334155; }

    .btn-rescan {
      background: transparent;
      border: 1.5px solid var(--brand-blue);
      color: var(--brand-blue);
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 16px;
      width: 100%;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
      margin-top: 14px;
    }

    .btn-rescan:hover {
      background: #eff6ff;
    }

    /* ── Status message ── */
    .status-bar {
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .status-bar.hidden { display: none; }
    .status-bar.info    { background: #eff6ff; color: #1d4ed8; }
    .status-bar.success { background: #f0fdf4; color: #15803d; }
    .status-bar.warning { background: #fffbeb; color: #b45309; }
    .status-bar.danger  { background: #fef2f2; color: #b91c1c; }

    /* ── Input group ── */
    .input-group .form-control {
      border-radius: 8px 0 0 8px !important;
      border: 1.5px solid #cbd5e1;
      font-size: 0.9rem;
      padding: 9px 14px;
    }

    .input-group .form-control:focus {
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .input-group .btn-outline-secondary {
      border: 1.5px solid #cbd5e1;
      border-left: none;
      border-radius: 0 8px 8px 0 !important;
      padding: 9px 14px;
      color: #475569;
    }

    .input-group .btn-outline-secondary:hover {
      background: #f1f5f9;
    }

    /* ── Details panel ── */
    .details-panel {
      min-height: 300px;
    }

    .details-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .details-empty i { font-size: 52px; color: #cbd5e1; margin-bottom: 14px; }
    .details-empty h5 { font-weight: 600; color: #334155; margin-bottom: 6px; }
    .details-empty p  { font-size: 0.85rem; margin: 0; }

    /* Product info */
    .product-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .product-title { font-weight: 700; font-size: 1.1rem; color: #0f172a; margin: 0 0 4px 0; }
    .product-barcode { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .stat-box .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; }
    .stat-box .value { font-size: 1.4rem; font-weight: 700; color: #0f172a; line-height: 1; }

    .stock-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .stock-badge.ok      { background: #dcfce7; color: #15803d; }
    .stock-badge.low     { background: #fee2e2; color: #b91c1c; }

    .locations-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .location-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.875rem;
    }

    .location-item .loc-name { font-weight: 600; color: #1e293b; }
    .location-item .loc-pos  { color: var(--text-muted); font-size: 0.8rem; }
    .location-item .loc-qty  { font-weight: 700; color: #0f172a; background: #e2e8f0; border-radius: 5px; padding: 2px 8px; }

    /* ── Spinner ── */
    .spin-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 14px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .spin-wrap .spinner-border { width: 2rem; height: 2rem; border-width: 0.2em; color: var(--brand-blue); }

    /* ── Pulse dot (camera active indicator) ── */
    .cam-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: #16a34a;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #16a34a;
      border-radius: 50%;
      animation: pulse-anim 1.2s ease infinite;
    }

    @keyframes pulse-anim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .navbar-brand {
      font-weight: 600;
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE = 'http://127.0.0.1:5500';
    const scannerMessage = document.getElementById('scannerMessage');
    const cameraToggleBtn = document.getElementById('cameraToggleBtn');
    const barcodeInput = document.getElementById('barcodeInput');
    const searchBtn = document.getElementById('searchBtn');
    const detailsPanel = document.getElementById('detailsPanel');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const cameraStatus = document.getElementById('cameraStatus');
    const reader = document.getElementById('reader');

    // Auth display: show logged-in user and admin link
    function updateAuthDisplay() {
      const userJson = localStorage.getItem('user');
      const userNameEl = document.getElementById('userName');
      const adminNavItem = document.getElementById('adminNavItem');
      if (userJson) {
        try {
          const u = JSON.parse(userJson);
          if (userNameEl) userNameEl.textContent = u.name || u.username || u.email || 'angemeldet';
          if (adminNavItem) adminNavItem.style.display = (u.email === 'admin@example.com') ? 'block' : 'none';
        } catch (_) {
          if (userNameEl) userNameEl.textContent = 'angemeldet';
        }
      } else {
        if (userNameEl) userNameEl.textContent = 'Nicht angemeldet';
      }

      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.location.href = 'http://127.0.0.1:5500/Frontend/login.html';
        });
      }
    }

  let html5QrCode  = null;
  let cameraRunning = false;
  let scanLocked    = false;

  /* ═══════════════════════════════════════
     AUDIO FEEDBACK
     Uses Web Audio API — no file needed
  ═══════════════════════════════════════ */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioCtx();
    return audioCtx;
  }

  function playBeep({ frequency = 880, duration = 0.12, type = 'sine', gain = 0.4, delay = 0 } = {}) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const vol = ctx.createGain();
      osc.connect(vol);
      vol.connect(ctx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, ctx.currentTime + delay);
      vol.gain.setValueAtTime(0, ctx.currentTime + delay);
      vol.gain.linearRampToValueAtTime(gain, ctx.currentTime + delay + 0.01);
      vol.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration + 0.01);
    } catch (e) { /* audio not supported — silently fail */ }
  }

  function soundSuccess() {
    // Two rising tones — satisfying "got it"
    playBeep({ frequency: 880, duration: 0.10, delay: 0 });
    playBeep({ frequency: 1320, duration: 0.15, delay: 0.10 });
  }

  function soundError() {
    // Low buzz
    playBeep({ frequency: 220, duration: 0.22, type: 'sawtooth', gain: 0.3 });
  }

  function soundNotFound() {
    // Descending double beep
    playBeep({ frequency: 600, duration: 0.12, delay: 0 });
    playBeep({ frequency: 380, duration: 0.18, delay: 0.12 });
  }

  /* ═══════════════════════════════════════
     STATUS BAR
  ═══════════════════════════════════════ */
  const iconMap = {
    info:    'bi-info-circle-fill',
    success: 'bi-check-circle-fill',
    warning: 'bi-exclamation-triangle-fill',
    danger:  'bi-x-circle-fill',
  };

  function setStatus(text, type = 'info') {
    statusBar.className = `status-bar ${type}`;
    statusIcon.className = `bi ${iconMap[type] || 'bi-info-circle-fill'}`;
    statusText.textContent = text;
  }

  function clearStatus() {
    statusBar.className = 'status-bar hidden';
  }

  /* ═══════════════════════════════════════
     SCAN FLASH ANIMATION
  ═══════════════════════════════════════ */
  function triggerFlash() {
    scanFlash.classList.remove('active');
    void scanFlash.offsetWidth; // reflow
    scanFlash.classList.add('active');
    scanFlash.addEventListener('animationend', () => {
      scanFlash.classList.remove('active');
    }, { once: true });
  }

    /* ═══════════════════════════════════════
     DETAILS PANEL RENDERING
  ═══════════════════════════════════════ */

    // show auth info once DOM is ready
    updateAuthDisplay();
  function renderEmpty() {
    detailsPanel.innerHTML = `
      <div class="details-empty">
        <i class="bi bi-upc-scan"></i>
        <h5>Kein Artikel gescannt</h5>
        <p>Scanne einen Barcode oder suche manuell,<br>um Produktdetails anzuzeigen.</p>
      </div>`;
  }

  function renderLoading() {
    detailsPanel.innerHTML = `
      <div class="spin-wrap">
        <div class="spinner-border" role="status"></div>
        <span>Produkt wird gesucht …</span>
      </div>`;
  }

  function renderProduct(payload) {
    const product     = payload.product;
    const lagerplaetze = payload.lagerplaetze || [];
    const lowStock    = product.aktuellerBestand <= product.mindestBestand;

    const locationsHtml = lagerplaetze.length === 0
      ? `<p class="text-muted mb-0" style="font-size:.85rem;">Kein Lagerplatz zugeordnet.</p>`
      : lagerplaetze.map(e => `
          <div class="location-item" data-plid="${e.plId ?? ''}" data-lagerplatzid="${e.lagerplatzId ?? ''}">
            <div>
              <div class="loc-name">${e.lagerName || 'Unbekanntes Lager'}</div>
              <div class="loc-pos"><i class="bi bi-geo-alt me-1"></i>${e.position}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="loc-qty">${e.menge ?? 0}</span>
              <button class="btn btn-sm btn-outline-secondary btn-edit-qty" data-plid="${e.plId ?? ''}" type="button">Bearbeiten</button>
            </div>
          </div>`).join('');

    detailsPanel.innerHTML = `
      <div class="product-header">
        <div>
          <p class="product-title">${product.produktName}</p>
          <span class="product-barcode"><i class="bi bi-upc me-1"></i>${product.barcode}</span>
        </div>
      </div>

      <div class="locations-title"><i class="bi bi-pin-map me-1"></i>Lagerplätze</div>
      ${locationsHtml}

      <div style="margin-top:12px;">
        <label class="form-label" style="font-size:.85rem;font-weight:600;margin-bottom:6px;">Artikel zu Lagerort hinzufügen</label>
        <div class="input-group mb-2">
          <select id="lagerSelect" class="form-select" style="min-width:160px"></select>

          <input id="lagerplatzInput" type="text" class="form-control" placeholder="Lagerplatz (z. B. A-01-01)" />
        </div>
        <div class="input-group mb-2">
          <input id="addQty" type="number" min="0" value="1" class="form-control" style="max-width:110px" />
          <button id="addToLocationBtn" class="btn btn-outline-secondary" type="button">Hinzufügen</button>
        </div>
        <div id="addResult" style="font-size:.85rem;margin-top:6px;color:#0f172a"></div>
      </div>

      <button class="btn-rescan" id="rescanBtn" type="button">
        <i class="bi bi-arrow-repeat"></i> Erneut scannen
      </button>`;
    document.getElementById('rescanBtn').addEventListener('click', () => {
      renderEmpty();
      clearStatus();
      barcodeInput.value = '';
      startCamera();
    });

    // prepare add-to-location UI
    (async () => {
      await loadLagerData();
      populateLagerSelect(product);
      attachLocationEditHandlers(product);
    })();
  }

  // --- Load lagers and lagerplaetze for add-to-location UI ---
  let _lagers = [];
  let _lagerplaetzeAll = [];

  async function loadLagerData() {
    try {
      const [r1, r2] = await Promise.all([fetch(`${API_BASE}/lager`), fetch(`${API_BASE}/lagerplatz`)]);
      if (r1.ok) _lagers = await r1.json(); else _lagers = [];
      if (r2.ok) _lagerplaetzeAll = await r2.json(); else _lagerplaetzeAll = [];
    } catch (e) {
      _lagers = [];
      _lagerplaetzeAll = [];
    }
  }

  function populateLagerSelect(product) {
    const lagerSel = document.getElementById('lagerSelect');
    if (!lagerSel) return;

    // fill lager select
    lagerSel.innerHTML = '';
    _lagers.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.lagerId;
      opt.textContent = `${l.lagerName} (${l.standort || ''})`;
      lagerSel.appendChild(opt);
    });

    if (_lagers.length === 0) {
      const opt = document.createElement('option'); opt.value = ''; opt.textContent = 'Keine Lager vorhanden'; lagerSel.appendChild(opt);
    }

    // initial fill
    if (lagerSel.options.length > 0) {
      lagerSel.selectedIndex = 0;
    }

    // add handler
    const addBtn = document.getElementById('addToLocationBtn');
    const addResult = document.getElementById('addResult');
    addBtn.addEventListener('click', async () => {
      addResult.textContent = '';
      const plText = (document.getElementById('lagerplatzInput')||{}).value || '';
      const qty = Number(document.getElementById('addQty').value || 0);
      if (!plText) { addResult.textContent = 'Bitte Lagerplatz angeben.'; return; }
      if (!qty || qty < 0) { addResult.textContent = 'Bitte Menge >= 0 angeben.'; return; }

      try {
        const lid = Number(lagerSel.value);
        // Try to find existing lagerplatz for this lager by text
        const match = _lagerplaetzeAll.find(p => Number(p.lagerId) === Number(lid) && `${p.regalNR}-${p.regalSection}-${p.regalShelf}`.toLowerCase() === plText.trim().toLowerCase());
        let targetPlId = match ? match.lagerplatzId : null;

        if (!targetPlId) {
          // try parse parts
          const parts = plText.trim().split('-').map(p => p.trim());
          if (parts.length !== 3) { addResult.textContent = 'Lagerplatz im Format A-01-01 angeben oder exakten bestehenden Namen.'; return; }
          const lpRes = await fetch(`${API_BASE}/lagerplatz`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lagerId: lid, regalNR: parts[0], regalSection: parts[1], regalShelf: parts[2] })
          });
          const lpJson = await lpRes.json();
          if (!lpRes.ok) { addResult.style.color='#b91c1c'; addResult.textContent = lpJson.error || 'Fehler beim Erstellen des Lagerplatzes'; soundError(); return; }
          targetPlId = lpJson.lagerplatzId;
          // update cache
          _lagerplaetzeAll.push(lpJson);
        }

        const body = { lagerplatzId: Number(targetPlId), productId: Number(product.productId), menge: Number(qty) };
        const res = await fetch(`${API_BASE}/zuordnung`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const d = await res.json();
        if (!res.ok) {
          addResult.style.color = '#b91c1c';
          addResult.textContent = d.error || 'Fehler beim Hinzufügen';
          soundError();
          return;
        }
        addResult.style.color = '#15803d';
        addResult.textContent = 'Artikel erfolgreich hinzugefügt.';
        soundSuccess();
        // refresh product display
        await fetchByBarcode(product.barcode);
      } catch (err) {
        addResult.style.color = '#b91c1c';
        addResult.textContent = 'Netzwerkfehler';
        soundError();
      }
    });
  }

  // attach edit handlers for location items
  function attachLocationEditHandlers(product) {
    document.querySelectorAll('.btn-edit-qty').forEach(btn => {
      btn.addEventListener('click', () => {
        const plId = btn.dataset.plid || btn.getAttribute('data-plid');
        const item = btn.closest('.location-item');
        if (!item) return;
        const qtySpan = item.querySelector('.loc-qty');
        const oldQty = Number(qtySpan.textContent || 0);
        // create inline editor
        const input = document.createElement('input'); input.type = 'number'; input.min = '0'; input.value = String(oldQty); input.style.maxWidth = '100px';
        const save = document.createElement('button'); save.className = 'btn btn-sm btn-primary'; save.textContent = 'Speichern';
        const cancel = document.createElement('button'); cancel.className = 'btn btn-sm btn-secondary'; cancel.textContent = 'Abbrechen';
        btn.style.display = 'none'; qtySpan.style.display = 'none';
        btn.parentElement.appendChild(input); btn.parentElement.appendChild(save); btn.parentElement.appendChild(cancel);

        cancel.addEventListener('click', () => { input.remove(); save.remove(); cancel.remove(); btn.style.display = ''; qtySpan.style.display = ''; });

        save.addEventListener('click', async () => {
          const newQty = Number(input.value || 0);
          if (Number.isNaN(newQty) || newQty < 0) { alert('Ungültige Menge'); return; }
          try {
            const lagerplatzId = Number(item.dataset.lagerplatzid) || null;
            const res = await fetch(`${API_BASE}/zuordnung/${plId}`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ lagerplatzId, productId: Number(product.productId), menge: newQty })
            });
            const d = await res.json();
            if (!res.ok) { alert(d.error || 'Fehler beim Speichern'); return; }
            qtySpan.textContent = String(newQty);
            input.remove(); save.remove(); cancel.remove(); btn.style.display = ''; qtySpan.style.display = '';
            soundSuccess();
          } catch (e) { alert('Netzwerkfehler'); }
        });
      });
    });
  }

  /* ═══════════════════════════════════════
     API FETCH
  ═══════════════════════════════════════ */
  async function fetchByBarcode(rawBarcode) {
    const barcode = (rawBarcode || '').trim();
    if (!barcode) {
      setStatus('Bitte einen Barcode eingeben.', 'warning');
      soundError();
      return;
    }

    renderLoading();
    setStatus('Suche Produkt …', 'info');

    try {
      const response = await fetch(`${API_BASE}/produkte/barcode/${encodeURIComponent(barcode)}`);
      const data     = await response.json();

      if (!response.ok) {
        setStatus(data.error || 'Produkt nicht gefunden.', 'warning');
        soundNotFound();
        renderEmpty();
        return;
      }

      renderProduct(data);
      setStatus(`Gefunden: ${data.product.produktName}`, 'success');
      soundSuccess();
    } catch (error) {
      console.error('Scanner lookup error:', error);
      setStatus('Server nicht erreichbar. Ist das Backend aktiv?', 'danger');
      soundError();
      renderEmpty();
    }
  }

  /* ═══════════════════════════════════════
     CAMERA
  ═══════════════════════════════════════ */
  async function stopCamera() {
    if (!cameraRunning || !html5QrCode) return;

    try {
      await html5QrCode.stop();
      await html5QrCode.clear();
    } catch (e) {
      console.error('Kamera-Stop fehlgeschlagen:', e);
    }

    cameraRunning = false;

    // UI
    camBtnIcon.className    = 'bi bi-camera-video';
    camBtnText.textContent  = 'Kamera starten';
    cameraToggleBtn.classList.remove('active-cam');
    camIndicator.classList.add('d-none');
    cameraInactive.classList.remove('d-none');
    reader.classList.add('d-none');
    scanOverlay.classList.add('d-none');
  }

  async function startCamera() {
    if (typeof Html5Qrcode === 'undefined') {
      setStatus('Scanner-Bibliothek konnte nicht geladen werden.', 'danger');
      return;
    }

    try {
      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || cameras.length === 0) {
        setStatus('Keine Kamera gefunden.', 'warning');
        return;
      }

      const backCamera     = cameras.find(c => /back|rear|environment/i.test(c.label));
      const selectedCamera = backCamera || cameras[0];

      html5QrCode = new Html5Qrcode('reader');

      // Show video area
      cameraInactive.classList.add('d-none');
      reader.classList.remove('d-none');
      scanOverlay.classList.remove('d-none');

      await html5QrCode.start(
        { deviceId: { exact: selectedCamera.id } },
        {
          fps: 12,
          qrbox: { width: 260, height: 110 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.CODABAR,
          ],
        },
        async (decodedText) => {
          if (scanLocked) return;
          scanLocked = true;

          triggerFlash();
          barcodeInput.value = decodedText;
          await stopCamera();
          await fetchByBarcode(decodedText);

          setTimeout(() => { scanLocked = false; }, 800);
        }
      );

      cameraRunning = true;

      // UI
      camBtnIcon.className   = 'bi bi-camera-video-off';
      camBtnText.textContent = 'Kamera stoppen';
      cameraToggleBtn.classList.add('active-cam');
      camIndicator.classList.remove('d-none');
      clearStatus();

    } catch (error) {
      console.error('Kamera-Start fehlgeschlagen:', error);
      setStatus('Kamera konnte nicht gestartet werden. Bitte Berechtigung prüfen.', 'danger');
      cameraInactive.classList.remove('d-none');
      reader.classList.add('d-none');
      scanOverlay.classList.add('d-none');
    }
  }

  /* ─── Event listeners ─── */
  cameraToggleBtn.addEventListener('click', async () => {
    if (cameraRunning) { await stopCamera(); } else { await startCamera(); }
  });

  searchBtn.addEventListener('click', () => fetchByBarcode(barcodeInput.value));

  barcodeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); fetchByBarcode(barcodeInput.value); }
  });

  window.addEventListener('beforeunload', stopCamera);
    </script>
  </body>
