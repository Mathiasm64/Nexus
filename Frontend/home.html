<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>WarehouseHub Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap CSS Framework -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons für Symbole -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <style>
    /* ============================================
       DASHBOARD STYLING
       ============================================ */
    
    /* Haupt-Body Hintergrund */
    body {
      background-color: #f5f5f7;
    }

    /* Navbar-Logo */
    .navbar-brand {
      font-weight: 600;
    }

    /* Aktiver Navigation Link */
    .nav-link.active {
      font-weight: 600;
    }

    /* Content-Wrapper mit Padding oben für fixed navbar */
    .content-wrapper {
      padding-top: 80px;
    }

    /* Seitentitel */
    .page-title {
      font-size: 1.8rem;
      font-weight: 600;
    }

    /* Untertitel */
    .sub-title {
      color: #6c757d;
    }

    /* Lagerkarten-Styling */
    .card-warehouse {
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .card-warehouse .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Tab-Navigation */
    .top-tabs .nav-link {
      border-radius: 999px;
      padding: 0.4rem 1.2rem;
    }

    .top-tabs .nav-link.active {
      background-color: #0d6efd;
      color: #fff !important;
    }

    .top-tabs .nav-link:not(.active) {
      color: #0d6efd;
      background-color: #e7f1ff;
    }

    /* Responsive Anpassung */
    @media (max-width: 576px) {
      .page-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- ============================================
       NAVIGATIONSBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container-fluid px-4">
      <!-- Branding mit Logo -->
      <a class="navbar-brand" href="http://127.0.0.1:5500/Frontend/home.html">
        <i class="bi bi-box-seam me-2"></i>WarehouseHub
      </a>
      
      <!-- Hamburger-Menü für mobile Geräte -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation Links -->
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-3 me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="http://127.0.0.1:5500/Frontend/lager_uebersicht.html">
              Warehouses
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="http://127.0.0.1:5500/Frontend/Scanner.html">Scanner</a>
          </li>
          <!-- Admin-Link nur für Admin-Benutzer sichtbar -->
          <li class="nav-item" id="adminNavItem" style="display: none;">
            <a class="nav-link" href="http://127.0.0.1:5500/Frontend/Admin.html">Admin</a>
          </li>
        </ul>

        <!-- Benutzerinformation und Logout -->
        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small">angemeldet als: <span id="userName">loading...</span></span>
          <button class="btn btn-outline-secondary btn-sm" id="logoutBtn">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ============================================
       HAUPT-INHALT
       ============================================ -->
  <div class="content-wrapper container mt-4">
    <!-- Header mit Titel -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
      <div>
        <div class="page-title">Warehouses</div>
        <div class="sub-title small">
          Verwalte deine Lagerstandorte und Bestände.
        </div>
      </div>
    </div>

    <!-- Container für Lagerkarten -->
    <div class="row g-4" id="warehouseContainer">
      <!-- Lagerkarten werden hier eingefügt -->
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
  
  <script>
    // ============================================
    // AUTHENTIFIZIERUNGS-FUNKTIONEN
    // ============================================

    /**
     * Prüft ob der Benutzer angemeldet ist
     * Falls nicht: Leiterung zum Login
     * Falls ja: Zeige Benutzernamen und Admin-Link falls zutreffend
     */
    function checkAuthentication() {
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      
      if (!token || !user) {
        // Benutzer nicht angemeldet - zur Login-Seite umleiten
        window.location.href = 'http://127.0.0.1:5500/Frontend/login.html';
        return;
      }
      
      try {
        // Parse und zeige Benutzerinformation
        const userData = JSON.parse(user);
        document.getElementById('userName').textContent = userData.name || userData.email;
        
        // Zeige Admin-Link nur für admin@example.com
        const adminNavItem = document.getElementById('adminNavItem');
        if (userData.email === 'admin@example.com') {
          adminNavItem.style.display = 'block';
        }
      } catch (error) {
        console.error('Error parsing user data:', error);
        document.getElementById('userName').textContent = 'Benutzer';
      }
    }
    
    // ============================================
    // LOGOUT-FUNKTION
    // ============================================
    
    document.getElementById('logoutBtn').addEventListener('click', () => {
      // Lösche Token und Benutzerinformation
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      
      // Leite zur Login-Seite um
      window.location.href = 'http://127.0.0.1:5500/Frontend/login.html';
    });
    
    // Authentifizierung beim Laden prüfen
    checkAuthentication();
    
    // ============================================
    // LADER-LOADING FUNKTIONEN
    // ============================================
    
    /**
     * Lädt alle Lager vom Server
     */
    async function loadWarehouses() {
      try {
        const response = await fetch('http://127.0.0.1:5500/lager');
        if (!response.ok) {
          throw new Error('Fehler beim Abrufen der Lager');
        }
        const lager = await response.json();
        displayWarehouses(lager);
      } catch (error) {
        console.error('Fehler beim Laden der Lager:', error);
        document.getElementById('warehouseContainer').innerHTML = '<div class="col-12"><div class="alert alert-danger">Fehler beim Laden der Lager</div></div>';
      }
    }
    
    /**
     * Zeige Lager als Karten
     * @param {Array} lager - Array mit Lagerobjekten
     */
    function displayWarehouses(lager) {
      const container = document.getElementById('warehouseContainer');
      
      if (!lager || lager.length === 0) {
        container.innerHTML = '<div class="col-12"><div class="alert alert-info">Keine Lager vorhanden</div></div>';
        return;
      }
      
      // Generiere HTML für jede Lagerkarte
      container.innerHTML = lager.map(warehouse => `
        <div class="col-md-6 col-lg-4">
          <div class="card card-warehouse h-100" style="cursor: pointer;" onclick="window.location.href='lager_uebersicht.html?lagerId=${warehouse.lagerId}'">
            <div class="card-body">
              <h5 class="card-title">${warehouse.lagerName}</h5>
              <p class="card-text">
                <strong>Standort:</strong> ${warehouse.standort}
              </p>
              <a href="lager_uebersicht.html?lagerId=${warehouse.lagerId}" class="btn btn-primary btn-sm" onclick="event.stopPropagation()">
                <i class="bi bi-eye me-1"></i>Zur Übersicht
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // ============================================
    // SEITEN-INITIALISIERUNG
    // ============================================
    
    document.addEventListener('DOMContentLoaded', () => {
      // Lade Lager beim Laden der Seite
      loadWarehouses();
    });
  </script>
</body>
</html>
