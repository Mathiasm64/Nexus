<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>WarehouseHub Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Optional: Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <style>
    body {
      background-color: #f5f5f7;
    }

    .navbar-brand {
      font-weight: 600;
    }

    .nav-link.active {
      font-weight: 600;
    }

    .content-wrapper {
      padding-top: 80px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .sub-title {
      color: #6c757d;
    }

    .card-warehouse {
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .card-warehouse .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .capacity-text {
      font-weight: 500;
    }

    .utilization-value {
      font-weight: 600;
    }

    .badge-utilization {
      font-size: 0.85rem;
      border-radius: 999px;
    }

    .btn-inventory {
      border-radius: 999px;
      padding: 0.35rem 1.2rem;
    }

    .badge-pill {
      border-radius: 999px;
    }

    .top-tabs .nav-link {
      border-radius: 999px;
      padding: 0.4rem 1.2rem;
    }

    .top-tabs .nav-link.active {
      background-color: #0d6efd;
      color: #fff !important;
    }

    .top-tabs .nav-link:not(.active) {
      color: #0d6efd;
      background-color: #e7f1ff;
    }

    @media (max-width: 576px) {
      .page-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#">
        <i class="bi bi-box-seam me-2"></i>WarehouseHub
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-3 me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="lager_uebersicht.html">
              Warehouses
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Scanner.html">Scanner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Admin</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small">angemeldet als: <span id="userName">loading...</span></span>
          <button class="btn btn-outline-secondary btn-sm" id="logoutBtn">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="content-wrapper container mt-4">
    <!-- Header row -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
      <div>
        <div class="page-title">Warehouses</div>
        <div class="sub-title small">
          Verwalte deine Lagerstandorte und Bestände.
        </div>
      </div>
      <div class="top-tabs d-flex align-items-center gap-2 mt-3 mt-sm-0">
        <ul class="nav">
          <li class="nav-item">
            <a href="lager_uebersicht.html?lagerId=${warehouse.lager_id}" class="nav-link active" href="#">Warehouses</a>
          </li>
          <li class="nav-item">
            <a href="lager_uebersicht.html?lagerId=${warehouse.lager_id}" class="nav-link" href="#">Inventory
              
            </a>
           
          </li>
        </ul>
        <button class="btn btn-primary ms-2">
          <i class="bi bi-plus-lg me-1"></i> Add Warehouse
        </button>
      </div>
    </div>

    <!-- Warehouse cards row -->
    <div class="row g-4" id="warehouseContainer">
      <!-- Lager werden hier eingefügt -->
    </div>

    
  </div>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
  
  <script>
    // Check if user is logged in
    function checkAuthentication() {
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      
      if (!token || !user) {
        // Redirect to login if not authenticated
        window.location.href = './login.html';
        return;
      }
      
      // Parse and display user info
      try {
        const userData = JSON.parse(user);
        document.getElementById('userName').textContent = userData.name || userData.email;
      } catch (error) {
        console.error('Error parsing user data:', error);
        document.getElementById('userName').textContent = 'Benutzer';
      }
    }
    
    // Handle logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      // Clear localStorage
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      
      // Redirect to login page
      window.location.href = './login.html';
    });
    
    // Check authentication on page load
    checkAuthentication();
    
    // Load warehouses
    async function loadWarehouses() {
      try {
        const response = await fetch('http://localhost:3000/lager');
        if (!response.ok) {
          throw new Error('Fehler beim Abrufen der Lager');
        }
        const lager = await response.json();
        displayWarehouses(lager);
      } catch (error) {
        console.error('Fehler beim Laden der Lager:', error);
        document.getElementById('warehouseContainer').innerHTML = '<div class="col-12"><div class="alert alert-danger">Fehler beim Laden der Lager</div></div>';
      }
    }
    
    // Display warehouses as cards
    function displayWarehouses(lager) {
      const container = document.getElementById('warehouseContainer');
      
      if (!lager || lager.length === 0) {
        container.innerHTML = '<div class="col-12"><div class="alert alert-info">Keine Lager vorhanden</div></div>';
        return;
      }
      
      container.innerHTML = lager.map(warehouse => `
        <div class="col-md-6 col-lg-4">
          <div class="card card-warehouse h-100">
            <div class="card-body">
              <h5 class="card-title">${warehouse.lagerName}</h5>
              <p class="card-text">
                <strong>Standort:</strong> ${warehouse.standort}
              </p>
              <a href="lager_uebersicht.html?lagerId=${warehouse.lager_id}" class="btn btn-primary btn-sm">
                <i class="bi bi-eye me-1"></i>Zur Übersicht
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // Load warehouses on page load
    loadWarehouses();
  </script>
</body>
</html>
