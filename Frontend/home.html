<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>WarehouseHub Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Optional: Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <style>
    body {
      background-color: #f5f5f7;
    }

    .navbar-brand {
      font-weight: 600;
    }

    .nav-link.active {
      font-weight: 600;
    }

    .content-wrapper {
      padding-top: 80px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .sub-title {
      color: #6c757d;
    }

    .card-warehouse {
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .card-warehouse .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .capacity-text {
      font-weight: 500;
    }

    .utilization-value {
      font-weight: 600;
    }

    .badge-utilization {
      font-size: 0.85rem;
      border-radius: 999px;
    }

    .btn-inventory {
      border-radius: 999px;
      padding: 0.35rem 1.2rem;
    }

    .badge-pill {
      border-radius: 999px;
    }

    .top-tabs .nav-link {
      border-radius: 999px;
      padding: 0.4rem 1.2rem;
    }

    .top-tabs .nav-link.active {
      background-color: #0d6efd;
      color: #fff !important;
    }

    .top-tabs .nav-link:not(.active) {
      color: #0d6efd;
      background-color: #e7f1ff;
    }

    @media (max-width: 576px) {
      .page-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="http://127.0.0.1:5500/Frontend/home.html">
        <i class="bi bi-box-seam me-2"></i>WarehouseHub
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-3 me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="http://127.0.0.1:5500/Frontend/lager_uebersicht.html">
              Warehouses
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="http://127.0.0.1:5500/Frontend/Scanner.html">Scanner</a>
          </li>
          <li class="nav-item" id="adminNavItem" style="display: none;">
            <a class="nav-link" href="http://127.0.0.1:5500/Frontend/Admin.html">Admin</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small">angemeldet als: <span id="userName">loading...</span></span>
          <button class="btn btn-outline-secondary btn-sm" id="logoutBtn">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="content-wrapper container mt-4">
    <!-- Header row -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
      <div>
        <div class="page-title">Warehouses</div>
        <div class="sub-title small">
          Verwalte deine Lagerstandorte und Bestände.
        </div>
      </div>
      <!--
      <div class="top-tabs d-flex align-items-center gap-2 mt-3 mt-sm-0">
        <ul class="nav">
          <li class="nav-item">
            <a href="http://127.0.0.1:5500/Frontend/lager_uebersicht.html?lagerId=${warehouse.lagerId}" class="nav-link active" href="#">Warehouses</a>
          </li>
          <li class="nav-item">
            <a href="http://127.0.0.1:5500/Frontend/lager_uebersicht.html?lagerId=${warehouse.lagerId}" class="nav-link" href="#">Inventory
            
            </a>
           
          </li>
        </ul>
        <button class="btn btn-primary ms-2" id="addWarehouseBtn">
          <i class="bi bi-plus-lg me-1"></i> Add Warehouse
        </button>
      </div>-->
    </div>

    <!-- Warehouse cards row -->
    <div class="row g-4" id="warehouseContainer">
      <!-- Lager werden hier eingefügt -->
    </div>

    
  </div>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
  
  <script>
    // Check if user is logged in
    function checkAuthentication() {
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      
      if (!token || !user) {
        // Redirect to login if not authenticated
        window.location.href = 'http://127.0.0.1:5500/Frontend/login.html';
        return;
      }
      
      // Parse and display user info
      try {
        const userData = JSON.parse(user);
        document.getElementById('userName').textContent = userData.name || userData.email;
        
        // Show Admin link only for admin@example.com
        const adminNavItem = document.getElementById('adminNavItem');
        if (userData.email === 'admin@example.com') {
          adminNavItem.style.display = 'block';
        }
      } catch (error) {
        console.error('Error parsing user data:', error);
        document.getElementById('userName').textContent = 'Benutzer';
      }
    }
    
    // Handle logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      // Clear localStorage
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      
      // Redirect to login page
      window.location.href = 'http://127.0.0.1:5500/Frontend/login.html';
    });
    
    // Check authentication on page load
    checkAuthentication();
    
    // Load warehouses
    async function loadWarehouses() {
      try {
        const response = await fetch('http://127.0.0.1:5500/lager');
        if (!response.ok) {
          throw new Error('Fehler beim Abrufen der Lager');
        }
        const lager = await response.json();
        displayWarehouses(lager);
      } catch (error) {
        console.error('Fehler beim Laden der Lager:', error);
        document.getElementById('warehouseContainer').innerHTML = '<div class="col-12"><div class="alert alert-danger">Fehler beim Laden der Lager</div></div>';
      }
    }
    
    // Display warehouses as cards
    function displayWarehouses(lager) {
      const container = document.getElementById('warehouseContainer');
      
      if (!lager || lager.length === 0) {
        container.innerHTML = '<div class="col-12"><div class="alert alert-info">Keine Lager vorhanden</div></div>';
        return;
      }
      
      container.innerHTML = lager.map(warehouse => `
        <div class="col-md-6 col-lg-4">
          <div class="card card-warehouse h-100" style="cursor: pointer;" onclick="window.location.href='lager_uebersicht.html?lagerId=${warehouse.lagerId}'">
            <div class="card-body">
              <h5 class="card-title">${warehouse.lagerName}</h5>
              <p class="card-text">
                <strong>Standort:</strong> ${warehouse.standort}
              </p>
              <a href="lager_uebersicht.html?lagerId=${warehouse.lagerId}" class="btn btn-primary btn-sm" onclick="event.stopPropagation()">
                <i class="bi bi-eye me-1"></i>Zur Übersicht
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // Initialize everything when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      // Load warehouses on page load
      loadWarehouses();
      
      // Handle Add Warehouse button
      const addBtn = document.getElementById('addWarehouseBtn');
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          const modal = new bootstrap.Modal(document.getElementById('addWarehouseModal'));
          modal.show();
        });
      }
      
      // Handle form submission
      const form = document.getElementById('addWarehouseForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const lagerName = document.getElementById('lagerName').value;
          const standort = document.getElementById('standort').value;
          
          try {
            const response = await fetch('http://127.0.0.1:5500/lager', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ lagerName, standort })
            });
            
            if (!response.ok) {
              throw new Error('Fehler beim Hinzufügen des Lagers');
            }
            
            const result = await response.json();
            
            // Close modal
            const modalElement = document.getElementById('addWarehouseModal');
            const modal = bootstrap.Modal.getInstance(modalElement);
            modal.hide();
            
            // Reset form
            document.getElementById('addWarehouseForm').reset();
            
            // Reload warehouses
            loadWarehouses();
          } catch (error) {
            console.error('Fehler:', error);
            alert('Fehler beim Hinzufügen des Lagers: ' + error.message);
          }
        });
      }
    });
  </script>
  
  <!-- Add Warehouse Modal -->
  <div class="modal fade" id="addWarehouseModal" tabindex="-1" aria-labelledby="addWarehouseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addWarehouseModalLabel">Neues Lager hinzufügen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addWarehouseForm">
            <div class="mb-3">
              <label for="lagerName" class="form-label">Lager Name</label>
              <input type="text" class="form-control" id="lagerName" required>
            </div>
            <div class="mb-3">
              <label for="standort" class="form-label">Standort</label>
              <input type="text" class="form-control" id="standort" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
          <button type="submit" form="addWarehouseForm" class="btn btn-primary">Hinzufügen</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
